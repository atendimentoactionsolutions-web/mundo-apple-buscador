<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login — Fornecedor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-input: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-red: #ef4444;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-full: 9999px;
      --shadow-glow: 0 0 35px rgba(16, 185, 129, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 10% 90%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), var(--shadow-glow);
      text-align: center;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-icon-wrap {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(5, 150, 105, 0.05) 100%);
      border: 1.5px solid rgba(16, 185, 129, 0.4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-green);
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0 14px;
      height: 50px;
      transition: all 0.2s ease;
    }

    .input-wrap:focus-within {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .input-icon {
      color: var(--text-muted);
      margin-right: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.96rem;
      font-weight: 500;
    }

    .input-wrap input::placeholder {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .toggle-pass-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      margin-left: 6px;
    }
    .toggle-pass-btn:hover {
      color: var(--text-primary);
    }

    /* Error and Warning Banner */
    .alert-banner {
      display: none;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 18px;
      text-align: left;
    }

    .alert-banner.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert-banner.expired {
      display: block;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-green-hover) 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.96rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Single session notice */
    .security-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 20px;
    }

    /* Footer WhatsApp Support */
    .support-footer {
      margin-top: 28px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .support-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #25d366;
      font-weight: 700;
      text-decoration: none;
      margin-top: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.25);
      transition: all 0.2s ease;
    }

    .support-link:hover {
      background: rgba(37, 211, 102, 0.2);
      transform: translateY(-1px);
    }

    /* Loading Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }
      .login-container {
        padding: 30px 20px;
        border-radius: 16px;
      }
      .brand-title {
        font-size: 1.22rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- Brand -->
    <div class="brand-group">
      <div class="logo-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-title">FORNECEDOR</span>
    </div>

    <h1 class="login-title">Acesso para Lojistas</h1>
    <p class="login-subtitle">Preços e estoque no atacado em tempo real</p>

    <!-- Error / Expired Alert -->
    <div id="alertBox" class="alert-banner"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Username -->
      <div class="form-group">
        <label class="form-label" for="username">Usuário</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="username" placeholder="Digite seu usuário de acesso" autocomplete="username" required autofocus>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
          <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()" title="Mostrar/ocultar senha">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Entrar no Sistema</span>
      </button>

      <!-- Security Notice -->
      <div class="security-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Proteção anti-pirataria: 1 tela ativa por conta</span>
      </div>
    </form>

    <!-- Support / Renovation -->
    <div class="support-footer">
      <div>Ainda não tem cadastro ou quer renovar seu plano?</div>
      <a class="support-link" href="https://wa.me/5511999999999?text=Ol%C3%A1!%20Gostaria%20de%20assinar/renovar%20o%20acesso%20ao%20Fornecedor." target="_blank" rel="noopener noreferrer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.301-.15-1.781-.879-2.057-.98-.276-.1-.477-.15-.678.15-.2.301-.778.98-.954 1.18-.175.201-.351.226-.652.075-1.933-.969-3.196-1.727-4.464-3.905-.337-.58.338-.538.968-1.799.1-.201.05-.376-.025-.526-.075-.15-.678-1.632-.929-2.235-.244-.588-.493-.508-.678-.517-.175-.008-.376-.01-.577-.01-.201 0-.527.075-.803.376-.276.301-1.054 1.03-1.054 2.511 0 1.481 1.079 2.91 1.23 3.111.15.201 2.123 3.242 5.143 4.546 2.067.893 2.87.897 3.896.744.624-.093 1.781-.728 2.032-1.431.251-.703.251-1.305.175-1.43-.075-.126-.276-.201-.577-.351zM12 21.848c-1.802 0-3.568-.485-5.116-1.405l-.367-.218-3.804.997 1.015-3.708-.239-.38C2.508 15.518 2 13.784 2 12c0-5.514 4.486-10 10-10s10 4.486 10 10-4.486 10-10 10zm0-18.182C7.488 3.666 3.818 7.336 3.818 12c0 1.636.474 3.208 1.371 4.564l.215.324-.606 2.215 2.268-.595.314.186C8.705 19.645 10.33 20.182 12 20.182c4.512 0 8.182-3.67 8.182-8.182 0-4.512-3.67-8.182-8.182-8.182z"/>
        </svg>
        <span>Falar no WhatsApp</span>
      </a>
    </div>

  </div>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="m15 18-.722-3.25"/>
          <path d="M2 8a10.645 10.645 0 0 0 20 0"/>
          <path d="m20 15-1.726-2.05"/>
          <path d="m4 15 1.726-2.05"/>
          <path d="m9 18 .722-3.25"/>
        `;
      } else {
        passInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        `;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');

      alertBox.style.display = 'none';
      alertBox.className = 'alert-banner';
      submitBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Verificando...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await resp.json();

        if (resp.ok && data.success) {
          btnText.textContent = 'Acesso Autorizado!';
          // Redireciona para o painel principal (ou para o admin se for admin)
          if (data.user && data.user.role === 'admin' && window.location.search.includes('redirect=admin')) {
            window.location.href = '/admin';
          } else {
            window.location.href = '/';
          }
        } else {
          alertBox.style.display = 'block';
          alertBox.textContent = data.error || 'Não foi possível realizar o login.';
          if (data.expired) {
            alertBox.classList.add('expired');
          } else {
            alertBox.classList.add('error');
          }
          submitBtn.disabled = false;
          spinner.style.display = 'none';
          btnText.textContent = 'Entrar no Sistema';
        }
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.classList.add('error');
        alertBox.textContent = 'Falha de comunicação com o servidor. Tente novamente.';
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Entrar no Sistema';
      }
    }
  </script>
</body>
</html>
