<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo Apple Buscador — Preços Atacado em Tempo Real</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="top-header">
    <div class="header-inner">
      <div class="brand-section">
        <div class="brand-logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"></path>
            <path d="M10 2c1 .5 2 2 2 5"></path>
          </svg>
          <span>MUNDO APPLE BUSCADOR</span>
        </div>
        <span class="brand-badge">ATACADO SP</span>
      </div>

      <!-- Live metrics -->
      <div class="header-metrics">
        <div class="live-indicator" id="connectionBadge">
          <span class="pulse-dot" id="connectionDot"></span>
          <span id="connectionText">TEMPO REAL ATIVO</span>
        </div>

        <div class="metric-pill">
          <span>USD Comercial:</span>
          <span class="dollar-rate" id="dollarRateText">R$ 5,1253</span>
          <span class="dollar-var" id="dollarVarText">(+0.57%)</span>
        </div>

        <div class="metric-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
            <line x1="16" x2="16" y1="2" y2="6"/>
            <line x1="8" x2="8" y1="2" y2="6"/>
            <line x1="3" x2="21" y1="10" y2="10"/>
          </svg>
          <span id="dateText">05-09</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="header-actions">
        <button class="action-btn" id="themeBtn" title="Alternar Modo Escuro / Claro">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <span id="themeLabel">Modo</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Category Nav Pills -->
  <div class="category-nav-wrapper">
    <nav class="category-nav" id="categoryNav">
      <button class="category-pill active" data-category="ALL">TODOS</button>
      <button class="category-pill" data-category="IPH">IPHONE</button>
      <button class="category-pill" data-category="MCB">MACBOOK</button>
      <button class="category-pill" data-category="IPAD">IPAD</button>
      <button class="category-pill" data-category="RLG">APPLE WATCH</button>
      <button class="category-pill" data-category="PODS">AIRPODS</button>
      <button class="category-pill" data-category="ACSS">ACESSÓRIOS</button>
      <button class="category-pill" data-category="IMAC">IMAC</button>
    </nav>
  </div>

  <!-- Search & Filter Controls -->
  <div class="filter-bar-wrapper">
    <div class="search-and-controls">
      <!-- Search Box with Autocomplete -->
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar por modelo (ex: 17 Pro Max, Air M5, S11, 256GB)..." autocomplete="off">
        <button class="search-clear-btn" id="searchClearBtn" style="display: none;" title="Limpar busca">✕</button>
        <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
      </div>

      <div class="secondary-filters">
        <!-- Storage Filter -->
        <select class="filter-select" id="storageFilter">
          <option value="">Capacidade (Todas)</option>
          <option value="64GB">64GB</option>
          <option value="128GB">128GB</option>
          <option value="256GB">256GB</option>
          <option value="512GB">512GB</option>
          <option value="1TB">1TB</option>
          <option value="2TB">2TB</option>
        </select>

        <!-- Color Filter -->
        <select class="filter-select" id="colorFilter">
          <option value="">Cor (Todas as Cores)</option>
        </select>

        <!-- Supplier Filter -->
        <select class="filter-select" id="supplierFilter">
          <option value="">Fornecedor (Todos)</option>
        </select>

        <!-- Order / Sort -->
        <select class="filter-select" id="sortFilter">
          <option value="price_asc">Menor Preço (Padrão)</option>
          <option value="price_desc">Maior Preço</option>
          <option value="name_asc">Nome (A-Z)</option>
          <option value="recent">Mais Recentes</option>
        </select>

        <!-- Verified Only Toggle -->
        <label class="toggle-filter">
          <input type="checkbox" id="verifiedOnly">
          <span>Verificados</span>
        </label>

        <!-- Clear Filters Button -->
        <button class="action-btn" id="clearFiltersBtn" title="Limpar todos os filtros">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span>Limpar</span>
        </button>
      </div>
    </div>

    <!-- Active Selected Model Banner -->
    <div id="activeModelBanner" style="display: none;" class="active-model-banner">
      <div class="active-model-info">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-lime);">
          <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
          <path d="M12 18h.01"/>
        </svg>
        <span>Modelo Isolado: <strong class="active-model-name" id="activeModelNameText">IPHONE 17 PRO MAX</strong> (<span id="activeModelCountText">0</span> opções disponíveis)</span>
      </div>
      <button class="remove-model-btn" id="removeModelBtn" title="Remover filtro de modelo">
        ✕ Ver todos os modelos
      </button>
    </div>
  </div>

  <!-- Results Count & Live Stats -->
  <div class="results-info-bar">
    <div>
      Exibindo <span class="count-highlight" id="shownCount">0</span> produtos Apple Novos de <span class="count-highlight" id="totalCount">0</span> disponíveis
    </div>
    <div id="supplierCountLabel">
      100+ fornecedores ativos
    </div>
  </div>

  <!-- TÓPICO: MELHORES PREÇOS POR COR -->
  <div class="best-prices-color-container" id="colorPricesTopic" style="display: none;"></div>

  <!-- Product Grid -->
  <main class="products-container" id="productsGrid">
    <!-- Populated dynamically via JS -->
  </main>

  <!-- Price History Modal -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="historyModalTitle">Histórico de Preços</h3>
        <button class="modal-close" id="closeHistoryModal">✕</button>
      </div>
      <div id="historyModalBody" style="font-size: 0.88rem; color: var(--text-secondary); max-height: 350px; overflow-y: auto;">
        Carregando histórico...
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
